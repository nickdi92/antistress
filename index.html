<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#071923">
<meta name="description" content="Scrivi quello che ti pesa e guardalo affondare nell'acqua.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<title>Lascia andare</title>
<style>
  :root {
    --deep: #06141f;
    --water: #0b2a3a;
    --ink: #ece8de;
    --ink-soft: rgba(236, 232, 222, .62);
    --ink-faint: rgba(236, 232, 222, .34);
    --accent: #9fd3d6;
    --serif: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--deep); color: var(--ink); overflow: hidden; }
  body { font-family: var(--serif); -webkit-font-smoothing: antialiased; }

  canvas { position: fixed; inset: 0; display: block; touch-action: manipulation; }

  .layer {
    position: fixed; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: max(24px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom));
    pointer-events: none;
    transition: opacity .7s ease;
  }
  .layer > * { pointer-events: auto; }
  .hidden { opacity: 0; pointer-events: none !important; }
  .hidden > * { pointer-events: none !important; }

  .prompt {
    margin: 0 0 18px; font-size: clamp(22px, 5vw, 30px); font-weight: 400;
    letter-spacing: .01em; color: var(--ink); text-align: center;
  }
  textarea {
    width: min(560px, 100%);
    min-height: 3.4em; max-height: 46vh;
    resize: none; overflow-y: auto;
    background: rgba(6, 20, 31, .28);
    border: 1px solid rgba(159, 211, 214, .16);
    border-radius: 18px;
    padding: 16px 18px;
    color: var(--ink);
    font: 400 22px/1.6 var(--serif);
    text-align: center;
    outline: none;
    backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px);
    transition: border-color .4s ease, opacity .45s ease;
  }
  textarea::placeholder { color: var(--ink-faint); font-style: italic; }
  textarea:focus { border-color: rgba(159, 211, 214, .38); }

  .btn {
    margin-top: 22px;
    font: 500 15px/1 var(--sans); letter-spacing: .06em;
    color: var(--deep); background: var(--accent);
    border: 0; border-radius: 999px; padding: 15px 28px;
    cursor: pointer;
    transition: opacity .4s ease, transform .2s ease, background .3s ease;
  }
  .btn:hover { background: #b8e2e4; }
  .btn:active { transform: scale(.97); }
  .btn:disabled { opacity: 0; transform: translateY(6px); cursor: default; }
  .btn.ghost { background: transparent; color: var(--ink-soft); border: 1px solid rgba(236,232,222,.25); }
  .btn.ghost:hover { color: var(--ink); border-color: rgba(236,232,222,.5); }

  .hint { margin: 14px 0 0; font: 12px/1 var(--sans); color: var(--ink-faint); letter-spacing: .04em; min-height: 12px; }
  @media (hover: none) { .hint { visibility: hidden; } }

  #msg { margin: 0; font-size: clamp(24px, 6vw, 34px); font-style: italic; color: var(--ink); text-align: center; transition: opacity .9s ease; min-height: 1.4em; }
  .breath {
    position: relative; width: 190px; height: 190px; margin: 34px 0 6px;
    display: grid; place-items: center;
    opacity: 0; transition: opacity 1s ease;
  }
  .breath.on { opacity: 1; }
  .breath::before {
    content: ""; position: absolute; inset: 0; border-radius: 50%;
    background: radial-gradient(circle, rgba(159,211,214,.30) 0%, rgba(159,211,214,.10) 55%, rgba(159,211,214,0) 72%);
    border: 1px solid rgba(159,211,214,.28);
    transform: scale(.42);
  }
  .breath.run::before { animation: breathe 10s ease-in-out 1 forwards; }
  @keyframes breathe { 0% { transform: scale(.42); } 40% { transform: scale(1); } 100% { transform: scale(.42); } }
  .breath span { position: relative; font: 13px/1 var(--sans); letter-spacing: .14em; text-transform: uppercase; color: var(--ink-soft); transition: opacity .6s ease; }

  #sound {
    position: fixed; top: max(14px, env(safe-area-inset-top)); right: 14px;
    width: 44px; height: 44px; border-radius: 50%;
    display: grid; place-items: center;
    background: rgba(6,20,31,.3); border: 1px solid rgba(236,232,222,.14);
    color: var(--ink-soft); cursor: pointer; z-index: 5;
    transition: color .3s ease, border-color .3s ease;
  }
  #sound:hover { color: var(--ink); border-color: rgba(236,232,222,.35); }
  #sound svg { width: 20px; height: 20px; }

  footer {
    position: fixed; left: 0; right: 0; bottom: max(14px, env(safe-area-inset-bottom));
    text-align: center; font: 12px/1.4 var(--sans); color: var(--ink-faint);
    padding: 0 16px; pointer-events: none; transition: opacity .6s ease;
  }

  @media (max-height: 560px) { .prompt { margin-bottom: 10px; } footer { display: none; } }
</style>
</head>
<body>
<canvas id="water" aria-hidden="true"></canvas>

<section class="layer" id="write">
  <h1 class="prompt">Cosa ti pesa, adesso?</h1>
  <textarea id="txt" rows="2" maxlength="600" placeholder="Scrivilo qui. Non lo leggerà nessuno." aria-label="Il pensiero da lasciare andare" autocomplete="off" autocorrect="off" spellcheck="false"></textarea>
  <button class="btn" id="go" disabled>Lascia andare</button>
  <p class="hint" id="hint">⌘ / Ctrl + Invio</p>
</section>

<section class="layer hidden" id="after" aria-live="polite">
  <p id="msg"></p>
  <div class="breath" id="breath"><span id="breathLabel">inspira</span></div>
  <button class="btn ghost hidden" id="again">Scrivi un altro pensiero</button>
</section>

<button id="sound" aria-label="Suono attivo" title="Suono"></button>
<footer id="foot">Niente viene salvato né inviato. Resta qui un momento, poi se ne va.</footer>

<script>
(() => {
  'use strict';

  /* ---------- storage (best effort) ---------- */
  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
  };

  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const FONT = getComputedStyle(document.documentElement).getPropertyValue('--serif').trim();

  /* ---------- elements ---------- */
  const $ = id => document.getElementById(id);
  const cv = $('water'), cx = cv.getContext('2d');
  const txt = $('txt'), go = $('go'), hint = $('hint');
  const writeL = $('write'), afterL = $('after'), msg = $('msg');
  const breath = $('breath'), breathLabel = $('breathLabel'), again = $('again');
  const soundBtn = $('sound'), foot = $('foot');

  if (/Mac|iPhone|iPad/.test(navigator.platform)) hint.textContent = '⌘ + Invio';
  else hint.textContent = 'Ctrl + Invio';

  /* ---------- canvas ---------- */
  let W = 0, H = 0, DPR = 1;
  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight;
    cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
    cv.style.width = W + 'px'; cv.style.height = H + 'px';
    cx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  addEventListener('resize', resize);
  resize();

  const rand = (a, b) => a + Math.random() * (b - a);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const easeInOut = t => t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
  const easeOut = t => 1 - Math.pow(1 - t, 3);
  const canBlur = 'filter' in CanvasRenderingContext2D.prototype && !reduced;

  // soft light patches drifting under the surface
  const blobs = Array.from({ length: 6 }, (_, i) => ({
    px: rand(0, 1), py: rand(0, 1), r: rand(.35, .7),
    sx: rand(.02, .05) * (Math.random() < .5 ? -1 : 1), sy: rand(.015, .04), ph: rand(0, 6.28)
  }));
  // tiny specks floating on the surface
  const specks = Array.from({ length: 46 }, () => ({
    x: rand(0, 1), y: rand(0, 1), s: rand(.6, 1.8), a: rand(.08, .3),
    vx: rand(-.004, .004), vy: rand(-.003, .003), ph: rand(0, 6.28)
  }));

  const ripples = [];
  function addRipple(x, y, size = 1, delay = 0) {
    ripples.push({ x, y, age: -delay, life: reduced ? 1.6 : 3.2, max: (reduced ? 50 : 110) * size });
    if (!reduced) ripples.push({ x, y, age: -delay - .28, life: 2.8, max: 70 * size });
  }

  function drawWater(t, dt) {
    const g = cx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#0c2f40'); g.addColorStop(.55, '#082231'); g.addColorStop(1, '#05121c');
    cx.fillStyle = g; cx.fillRect(0, 0, W, H);

    const m = Math.max(W, H);
    cx.globalCompositeOperation = 'lighter';
    for (const b of blobs) {
      const x = (((b.px + Math.sin(t * b.sx + b.ph) * .25) % 1) + 1) % 1 * W;
      const y = (((b.py + Math.cos(t * b.sy + b.ph) * .2) % 1) + 1) % 1 * H;
      const r = b.r * m * (0.9 + 0.1 * Math.sin(t * .3 + b.ph));
      const rg = cx.createRadialGradient(x, y, 0, x, y, r);
      rg.addColorStop(0, 'rgba(70,160,180,0.07)');
      rg.addColorStop(1, 'rgba(70,160,180,0)');
      cx.fillStyle = rg; cx.fillRect(x - r, y - r, r * 2, r * 2);
    }
    cx.globalCompositeOperation = 'source-over';

    for (const s of specks) {
      if (!reduced) { s.x = (s.x + s.vx * dt + 1) % 1; s.y = (s.y + s.vy * dt + 1) % 1; }
      const a = s.a * (0.6 + 0.4 * Math.sin(t * .8 + s.ph));
      cx.fillStyle = `rgba(200,235,235,${a})`;
      cx.beginPath(); cx.arc(s.x * W, s.y * H, s.s, 0, 6.283); cx.fill();
    }

    for (let i = ripples.length - 1; i >= 0; i--) {
      const r = ripples[i];
      r.age += dt;
      if (r.age < 0) continue;
      const p = r.age / r.life;
      if (p >= 1) { ripples.splice(i, 1); continue; }
      const rad = easeOut(p) * r.max;
      const a = (1 - p) * .38;
      cx.strokeStyle = `rgba(190,232,234,${a})`;
      cx.lineWidth = 1.4 * (1 - p) + .4;
      cx.beginPath(); cx.ellipse(r.x, r.y, rad, rad * .58, 0, 0, 6.283); cx.stroke();
    }
  }

  /* ---------- words ---------- */
  let words = [];
  let releaseAt = 0;

  function layoutWords(text) {
    const rect = txt.getBoundingClientRect();
    const maxW = Math.min(rect.width - 36, W - 32);
    let fs = 22, lines;
    for (;;) {
      cx.font = `400 ${fs}px ${FONT}`;
      const sp = cx.measureText(' ').width;
      lines = [];
      for (const para of text.split('\n')) {
        const ws = para.split(/\s+/).filter(Boolean);
        if (!ws.length) { if (lines.length) lines.push({ items: [], w: 0 }); continue; }
        let line = { items: [], w: 0 };
        for (const w of ws) {
          const ww = cx.measureText(w).width;
          if (line.items.length && line.w + sp + ww > maxW) { lines.push(line); line = { items: [], w: 0 }; }
          line.w += (line.items.length ? sp : 0) + ww;
          line.items.push({ t: w, w: ww });
        }
        lines.push(line);
      }
      while (lines.length && !lines[lines.length - 1].items.length) lines.pop();
      if (lines.length * fs * 1.6 <= H * .62 || fs <= 13) break;
      fs -= 1;
    }
    const lh = fs * 1.6;
    const sp = cx.measureText(' ').width;
    const cy = rect.top + rect.height / 2;
    let y = cy - (lines.length * lh) / 2 + lh / 2;
    const out = [];
    for (const line of lines) {
      let x = W / 2 - line.w / 2;
      for (const it of line.items) {
        out.push({ t: it.t, x: x + it.w / 2, y, w: it.w, fs, started: false, done: false,
          dx: rand(-14, 14), dy: rand(4, 18), rot: rand(-.18, .18), dur: rand(2.2, 3), start: 0 });
        x += it.w + sp;
      }
      y += lh;
    }
    // reading order, gentle stagger, total sink time capped
    const n = out.length;
    const gap = clamp(9 / Math.max(n, 1), .16, .55);
    out.forEach((w, i) => { w.sinkAt = 1.4 + i * gap + rand(0, gap * .5); });
    return out;
  }

  function drawWords(t) {
    const since = t - releaseAt;
    cx.textAlign = 'center'; cx.textBaseline = 'middle';
    let allDone = true;
    words.forEach((w, i) => {
      if (w.done) return;
      allDone = false;
      if (!w.started && since >= w.sinkAt) {
        w.started = true; w.start = t;
        addRipple(w.x, w.y, clamp(w.w / 70, .6, 1.4));
        audio.drop(); buzz();
      }
      let e = 0;
      if (w.started) {
        e = clamp((t - w.start) / w.dur, 0, 1);
        if (e >= 1) { w.done = true; return; }
      }
      const ee = easeInOut(e);
      const fadeIn = clamp(since / .45, 0, 1);
      const bob = reduced ? 0 : Math.sin(t * 1.6 + i * .7) * 1.6 * (1 - ee);
      const s = reduced ? 1 : 1 - .55 * ee;
      const a = fadeIn * (1 - Math.pow(e, 1.15));
      // ink cools into the water colour as it sinks
      const r = Math.round(236 - 116 * ee), g = Math.round(232 - 52 * ee), b = Math.round(222 - 32 * ee);
      cx.save();
      cx.translate(w.x + (reduced ? 0 : w.dx * ee), w.y + bob + (reduced ? 0 : w.dy * ee));
      if (!reduced) cx.rotate(w.rot * ee);
      cx.scale(s, s);
      cx.globalAlpha = a;
      if (canBlur && ee > .02) cx.filter = `blur(${(ee * 5).toFixed(2)}px)`;
      cx.font = `400 ${w.fs}px ${FONT}`;
      cx.fillStyle = `rgb(${r},${g},${b})`;
      cx.fillText(w.t, 0, 0);
      cx.restore();
    });
    return allDone;
  }

  /* ---------- audio ---------- */
  const audio = (() => {
    let ac = null, master = null, wet = null, amb = null;
    let on = store.get('sound', true);
    const notes = [392.0, 440.0, 523.25, 587.33, 659.25, 783.99]; // pentatonica: sempre consonante

    function init() {
      if (ac) { if (ac.state === 'suspended') ac.resume(); return; }
      const C = window.AudioContext || window.webkitAudioContext;
      if (!C) return;
      ac = new C();
      master = ac.createGain(); master.gain.value = on ? 1 : 0; master.connect(ac.destination);

      // small watery echo
      const d = ac.createDelay(1); d.delayTime.value = .23;
      const fb = ac.createGain(); fb.gain.value = .33;
      const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 1700;
      wet = ac.createGain(); wet.gain.value = .45;
      wet.connect(d); d.connect(lp); lp.connect(fb); fb.connect(d); lp.connect(master);

      // ambient: brown noise, low-passed, slowly breathing like small waves
      const len = ac.sampleRate * 6, buf = ac.createBuffer(1, len, ac.sampleRate), data = buf.getChannelData(0);
      let last = 0;
      for (let i = 0; i < len; i++) { last = (last + .02 * (Math.random() * 2 - 1)) / 1.02; data[i] = last * 3.5; }
      const a0 = data[0], a1 = data[len - 1];
      for (let i = 0; i < len; i++) data[i] -= a0 + (a1 - a0) * (i / len); // seamless loop
      const src = ac.createBufferSource(); src.buffer = buf; src.loop = true;
      const f = ac.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 420;
      const lfo = ac.createOscillator(); lfo.frequency.value = .09;
      const lfoG = ac.createGain(); lfoG.gain.value = 180;
      lfo.connect(lfoG); lfoG.connect(f.frequency);
      amb = ac.createGain(); amb.gain.value = 0;
      src.connect(f); f.connect(amb); amb.connect(master);
      src.start(); lfo.start();
      amb.gain.setTargetAtTime(.06, ac.currentTime, 2.5);
    }

    function drop(soft = 1) {
      if (!ac || !on) return;
      const t = ac.currentTime;
      const fr = notes[Math.random() * notes.length | 0] * (Math.random() < .35 ? .5 : 1);
      const o = ac.createOscillator(); o.type = 'sine';
      o.frequency.setValueAtTime(fr * .72, t);
      o.frequency.exponentialRampToValueAtTime(fr, t + .055);
      const g = ac.createGain();
      g.gain.setValueAtTime(.0001, t);
      g.gain.exponentialRampToValueAtTime(.16 * soft, t + .008);
      g.gain.exponentialRampToValueAtTime(.0001, t + .7);
      o.connect(g); g.connect(master); g.connect(wet);
      o.start(t); o.stop(t + .75);
    }

    function setOn(v) {
      on = v; store.set('sound', v);
      if (ac) master.gain.setTargetAtTime(v ? 1 : 0, ac.currentTime, .15);
    }
    return { init, drop, setOn, get on() { return on; } };
  })();

  const buzz = () => { try { navigator.vibrate && navigator.vibrate(9); } catch {} };

  const ICON_ON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5h3.2L12 5.5v13l-4.8-4H4z"/><path d="M15.5 9a4.2 4.2 0 0 1 0 6"/><path d="M18.2 6.5a8 8 0 0 1 0 11"/></svg>';
  const ICON_OFF = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5h3.2L12 5.5v13l-4.8-4H4z"/><path d="M16 9.5l5 5M21 9.5l-5 5"/></svg>';
  function paintSound() {
    soundBtn.innerHTML = audio.on ? ICON_ON : ICON_OFF;
    soundBtn.setAttribute('aria-label', audio.on ? 'Suono attivo: tocca per spegnere' : 'Suono spento: tocca per attivare');
  }
  paintSound();
  soundBtn.addEventListener('click', () => { audio.init(); audio.setOn(!audio.on); paintSound(); });

  // audio can only start after a user gesture
  addEventListener('pointerdown', () => audio.init(), { once: true, capture: true });
  addEventListener('keydown', () => audio.init(), { once: true, capture: true });

  /* ---------- flow ---------- */
  let state = 'write';
  const timers = [];
  const later = (fn, ms) => timers.push(setTimeout(fn, ms));
  const clearTimers = () => { while (timers.length) clearTimeout(timers.pop()); };

  function autogrow() {
    txt.style.height = 'auto';
    txt.style.height = Math.min(txt.scrollHeight + 2, innerHeight * .46) + 'px';
  }
  txt.addEventListener('input', () => { go.disabled = !txt.value.trim(); autogrow(); });
  txt.addEventListener('keydown', e => {
    if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) { e.preventDefault(); release(); }
  });
  go.addEventListener('click', release);

  function release() {
    const text = txt.value.trim();
    if (state !== 'write' || !text) return;
    audio.init();
    state = 'release';
    words = layoutWords(text);
    releaseAt = performance.now() / 1000;
    txt.blur();
    writeL.classList.add('hidden');
    foot.style.opacity = '0';
  }

  function showAfter() {
    state = 'after';
    txt.value = ''; go.disabled = true; autogrow();
    msg.style.opacity = '0';
    afterL.classList.remove('hidden');
    breath.classList.remove('on', 'run');
    again.classList.add('hidden');

    later(() => { msg.textContent = 'Andato.'; msg.style.opacity = '1'; }, 200);
    later(() => { msg.style.opacity = '0'; }, 2600);
    later(() => {
      msg.textContent = 'Un respiro lento.'; msg.style.opacity = '1';
      breathLabel.textContent = 'inspira'; breathLabel.style.opacity = '1';
      breath.classList.add('on');
      void breath.offsetWidth; breath.classList.add('run');
    }, 3600);
    later(() => { breathLabel.style.opacity = '0'; }, 7300);
    later(() => { breathLabel.textContent = 'espira'; breathLabel.style.opacity = '1'; }, 7700);
    later(() => { breathLabel.style.opacity = '0'; }, 13200);
    later(() => { again.classList.remove('hidden'); }, 13800);
  }

  // tap during the closing sequence → skip straight to the button
  afterL.addEventListener('pointerdown', e => {
    if (state === 'after' && e.target !== again && again.classList.contains('hidden')) {
      clearTimers();
      msg.textContent = 'Andato.'; msg.style.opacity = '1';
      breath.classList.remove('on', 'run');
      again.classList.remove('hidden');
    }
  });

  again.addEventListener('click', () => {
    clearTimers();
    state = 'write';
    afterL.classList.add('hidden');
    writeL.classList.remove('hidden');
    foot.style.opacity = '1';
    setTimeout(() => txt.focus({ preventScroll: true }), 350);
  });

  // touching the water while writing: a ripple and a soft note
  cv.addEventListener('pointerdown', e => {
    if (state !== 'write') return;
    addRipple(e.clientX, e.clientY, .8);
    audio.init(); audio.drop(.6);
  });

  /* ---------- loop ---------- */
  let prev = performance.now() / 1000;
  let doneAt = 0;
  function frame(now) {
    const t = now / 1000, dt = Math.min(t - prev, .05); prev = t;
    drawWater(t, dt);
    if (state === 'release') {
      const allDone = drawWords(t);
      if (allDone) {
        if (!doneAt) doneAt = t;
        if (t - doneAt > 1.3) { doneAt = 0; words = []; showAfter(); }
      }
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  /* ---------- offline / installable ---------- */
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
    addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
  }
})();
</script>
</body>
</html>
