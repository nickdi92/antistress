name: LetGo
options:
  bundleIdPrefix: io.github.nickdi92
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
targets:
  LetGo:
    type: application
    platform: iOS
    sources:
      - path: LetGo
    info:
      path: LetGo/Info.plist
      properties:
        CFBundleDisplayName: Let Go
        CFBundleDevelopmentRegion: en
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        ITSAppUsesNonExemptEncryption: false
        LSApplicationCategoryType: public.app-category.healthcare-fitness
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.nickdi92.letgo
        PRODUCT_NAME: LetGo
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  LetGoTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: LetGoTests
    dependencies:
      - target: LetGo
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.nickdi92.letgo.tests
        GENERATE_INFOPLIST_FILE: YES
  LetGoUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: LetGoUITests
    dependencies:
      - target: LetGo
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.nickdi92.letgo.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: LetGo
schemes:
  LetGo:
    build:
      targets:
        LetGo: all
    test:
      targets:
        - LetGoTests
        - LetGoUITests
